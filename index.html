<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Безопасный труд повара. Прототип двух упражнений</title>
<style>
:root{
  --cream:#FBF4EA; --paper:#FFFDF8; --ink:#2B2623; --sage:#BFD6C6; --peach:#F4D6C2;
  --butter:#F1DFA8; --signal:#E8452C; --line:#E6DAC8; --muted:#6E6258; --ok:#3F7A57; --tile:#F2E9DA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;padding:0 0 calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;min-height:52px}
.top .t{font-weight:700;font-size:15px;flex:1}
.dots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--ink)}
.dot.done{background:var(--ok)}
.wrap{padding:8px 16px 16px;flex:1}
h1{font-size:26px;line-height:1.15;margin:8px 0 8px}
h2{font-size:20px;margin:6px 0}
p{font-size:16px;line-height:1.45;margin:6px 0}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--ink);color:var(--paper);font-size:17px;font-weight:700;padding:14px 18px;margin:12px 0 0;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{min-height:48px;font-size:15px;padding:10px 14px;margin-top:8px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;margin:8px 0}
.chip{display:inline-block;background:var(--butter);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.scene{background:var(--paper);border:2px solid var(--line);border-radius:22px;overflow:hidden;line-height:0;position:relative}
.scene svg{width:100%;height:auto;display:block}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0;font-size:16px;line-height:1.4}
.panel.warn{border-color:var(--signal)}
.panel.good{border-color:var(--ok)}
.panel b{display:block;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:56px;text-align:left;border:2px solid var(--line);background:var(--peach);border-radius:14px;padding:10px 14px;font-size:16px;line-height:1.3;font-family:inherit;color:var(--ink);cursor:pointer}
.opt.bad{opacity:.4;text-decoration:line-through;cursor:default}
#helper{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
#helper .in{max-width:456px;width:100%;display:none;gap:10px;align-items:flex-end;justify-content:flex-end}
#helper.show .in{display:flex}
#helper img{width:52px;height:52px;flex:none;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
#hbtn{pointer-events:auto;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;color:var(--ink);order:2}
#helper .bubble{display:none}
#helper.open .bubble{display:block}
#helper.open #hlab{display:none}
#helper .bubble{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:10px 14px;font-size:15px;line-height:1.35;flex:1;box-shadow:0 6px 18px rgba(43,38,35,.12)}
.memo li{margin:8px 0;font-size:16px;line-height:1.4}
.center{text-align:center}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.4}
.yn{display:flex;gap:10px;margin-top:12px}
.yn button{flex:1;min-height:64px;border-radius:16px;border:2px solid var(--ink);font-size:19px;font-weight:800;font-family:inherit;color:var(--ink);cursor:pointer}
.yn button[disabled]{opacity:.35;cursor:default}
.yn .y{background:var(--sage)}.yn .n{background:var(--peach)}
.src{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.kit{display:flex;gap:10px;align-items:stretch;margin:6px 0}
.kit .who{flex:1;background:var(--paper);border:2px solid var(--line);border-radius:22px;display:flex;align-items:flex-end;justify-content:center;padding:8px 0 4px}
.kit .lock{flex:1;background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:10px;text-align:center;font-size:13px;color:var(--muted)}
.lock .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px;min-height:84px;align-content:flex-start}
.lock .in img{width:40px;height:40px;background:var(--tile);border-radius:10px;padding:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.tile{background:var(--tile);border:2px solid var(--tile);border-radius:14px;padding:6px 2px 6px;font-family:inherit;font-size:12px;line-height:1.15;color:var(--ink);cursor:pointer;min-height:88px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tile img{width:48px;height:48px}
.tile.sel{border:3px solid var(--ink);background:var(--butter);box-shadow:0 4px 10px rgba(43,38,35,.18);position:relative}
.tile.sel:after{content:"✓";position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;line-height:22px;text-align:center}
.tile{font-size:13px}
.kfb{min-height:150px}
.kh{display:flex;align-items:center;gap:12px;font-size:18px;margin:2px 0 6px}
.kh img{width:64px;height:64px;background:var(--tile);border-radius:14px;padding:4px}
.kc{display:block;width:100%;min-height:44px;margin-top:8px;border:0;background:transparent;font-family:inherit;font-size:15px;color:var(--muted);text-decoration:underline;cursor:pointer}
.tiles.pulse .tile{animation:tp 1.6s ease-in-out infinite}
@keyframes tp{0%,100%{box-shadow:0 0 0 0 rgba(43,38,35,0)}50%{box-shadow:0 0 0 4px rgba(241,223,168,.95)}}
@media (prefers-reduced-motion:reduce){.tiles.pulse .tile{animation:none;border-color:var(--butter)}}
.yn-note{margin-top:12px;min-height:64px;border:2px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);font-weight:600}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.sheet .in{pointer-events:auto;width:100%;max-width:480px;background:var(--paper);border:2px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(43,38,35,.16);padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:62vh;overflow:auto;animation:up .22s ease}
.sheet .in.warn{border-color:var(--signal)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet .q{font-weight:800;margin:10px 0 8px}
.sheet .fb{font-size:15px;line-height:1.35;background:#FBEBE2;border-radius:12px;padding:10px 12px;margin:8px 0}
.tile.used{visibility:hidden}
.pers{display:block;width:auto;max-width:100%}
.pick{flex:1;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px}
.pick .g{width:44px;height:44px;border-radius:50%;background:var(--butter);display:flex;align-items:center;justify-content:center}
.kit .who{flex-direction:column;align-items:center}
.worn-l{font-size:12px;color:var(--muted);margin-top:4px}
.worn{display:flex;gap:4px;justify-content:center;min-height:44px;margin-top:2px}
.bk{border:0;padding:0;background:transparent;cursor:pointer;width:44px;height:44px}
.bk img,.lock .in .bk img{width:44px;height:44px;background:var(--tile);border-radius:10px;padding:3px}
.stat{display:flex;justify-content:space-between;gap:10px;text-align:left;font-size:15px;border-top:1px solid var(--line);padding:8px 0 0;margin-top:8px}
.skip{border:2px solid var(--line);background:var(--paper);border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);min-height:36px;padding:4px 12px;cursor:pointer;margin-left:6px}
.jump{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--muted)}
.jump span{width:100%}
.jump{border-top:1px dashed var(--line);padding-top:12px;margin-top:18px}
.jump button{border:1px solid var(--line);background:transparent;border-radius:999px;font-family:inherit;font-size:13px;color:var(--muted);min-height:44px;padding:6px 12px;cursor:pointer}
.mc{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px;margin:0 0 10px}
.mc.warnc{border-color:var(--signal)}
.mh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;margin-bottom:10px}
.mn{width:28px;height:28px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.warnc .mn{background:var(--peach)}
.mrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.ml{flex:none;width:82px;font-size:13px;font-weight:700;border-radius:999px;padding:5px 0;text-align:center}
.ml.ok{background:var(--sage)}.ml.no{background:var(--peach)}
.mi{display:flex;flex-wrap:wrap;gap:4px}
.mi img{width:38px;height:38px;background:var(--tile);border-radius:9px;padding:3px}
.mt{font-size:15px;line-height:1.35}
.cols{display:flex;gap:8px}
.col{flex:1;background:#EEF4EF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.3}
.col.tell{background:#FBEBE2}
.col b{font-size:14px;margin-bottom:2px}
.steps{display:flex;gap:6px}
.steps span{flex:1;background:#FBEBE2;border-radius:14px;padding:8px 6px;font-size:14px;font-weight:600;line-height:1.25;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.steps i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--signal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.rep{margin-top:16px;text-align:left;font-size:14px;color:var(--muted)}
.rep summary{cursor:pointer;min-height:44px;display:list-item;list-style-position:inside;text-align:center;line-height:44px}
.big{display:block;width:120px;height:120px;margin:4px auto 0}
.smk{animation:smk 4s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.smk.d2{animation-delay:1.33s}.smk.d3{animation-delay:2.66s}
@keyframes smk{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.85}100%{transform:translateY(-38px) scale(1.5);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.smk{animation:none;opacity:.7}.smk.d2{transform:translateY(-14px)}.smk.d3{transform:translateY(-28px)}}
</style>
</head>

<div id="app"></div>
<div id="sr" class="sr" aria-live="polite" aria-atomic="true"></div>

function bbox(o){var b=[999,999,-1,-1];o.z.forEach(function(r){b[0]=Math.min(b[0],r[0]);b[1]=Math.min(b[1],r[1]);b[2]=Math.max(b[2],r[2]);b[3]=Math.max(b[3],r[3])});return b}
function scene(mode,found){
  var s='<svg viewBox="0 0 '+VW+' '+VH+'" id="sc" role="img" aria-label="'+(mode===1?'Кухня перед сменой':'Кухня во время смены, над мясорубкой дым')+'">';
  s+='<image href="'+(mode===1?IMG.scene1:IMG.scene2)+'" width="'+VW+'" height="'+VH+'"/>';
  if(mode===2){[["",0],["d2",1],["d3",2]].forEach(function(a){var x=200+a[1]*3;s+='<g class="smk '+a[0]+'"><circle cx="'+x+'" cy="88" r="7" fill="#8F8983"/><circle cx="'+(x+6)+'" cy="83" r="5.5" fill="#A39D97"/><circle cx="'+(x-5)+'" cy="82" r="5" fill="#A39D97"/></g>'});}
  (found||[]).forEach(function(id){HOT.forEach(function(o){if(o.id!==id)return;var b=bbox(o),p=3;
    s+='<rect x="'+(b[0]-p)+'" y="'+(b[1]-p)+'" width="'+(b[2]-b[0]+2*p)+'" height="'+(b[3]-b[1]+2*p)+'" rx="8" fill="rgba(232,69,44,.10)" stroke="#E8452C" stroke-width="3"/>';
    var cx=Math.min(b[2]+p,VW-10),cy=Math.max(b[1]-p,10);
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="#E8452C"/><path d="M'+(cx-4)+' '+cy+'l3 3 5-6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>';});});
  return s+'</svg>';

function byId(id){return HOT.filter(function(o){return o.id===id})[0]}
function hintFind(){
  S.hints++;save();

  return "Ещё не найдено: "+rest.join(", ");
}
function resolved(){return Object.keys(S.res).length}
function rFind(){
  app.innerHTML=top("Осмотр перед сменой",true)+'<div class="wrap fade"><div class="scene" id="scw">'+scene(1,S.found)+'</div><div id="pn"></div></div>';
  $("#sc").addEventListener("click",onScene);drawFind();arm(hintFind);

function drawFind(){
  var n=S.found.length,t=HOT.length,h='';

  h+='<div class="panel"><b>Найдено '+n+' из '+t+'</b></div>';
  if(S.msg){h+='<div class="panel '+(S.warn?'warn':(S.good?'good':''))+'">'+S.msg+'</div>'}
  var sh=document.getElementById("sheet");if(sh)sh.remove();

    var s='<div class="in'+(S.afb?' warn':'')+'" role="dialog" aria-label="'+o.name+'"><div class="grab"></div><b style="font-size:17px">'+o.name+'</b><div style="font-size:15px;line-height:1.35;margin-top:2px">'+o.why+'</div><span class="src">Документ: '+o.src+'</span>'+
      (S.afb?'<div class="fb"><b>Это не подходит.</b> '+S.afb+'</div>':'')+'<div class="q">'+(S.afb?'Выберите другой вариант':'Что сделать?')+'</div><div class="opts">'+
      o.a.map(function(c,i){var bad=(S.atried||[]).indexOf(i)>=0;return '<button class="opt'+(bad?' bad':'')+'" data-a="'+i+'"'+(bad?' disabled':'')+'>'+c.t+'</button>'}).join('')+'</div></div>';
    var el=document.createElement("div");el.id="sheet";el.className="sheet";el.innerHTML=s;document.body.appendChild(el);var f=el.querySelector("[data-a]:not([disabled])");if(f)f.focus({preventScroll:true});}

  else{h+='<button class="btn ghost sm" id="hint">Нужна подсказка</button>'}

  var hb=$("#hint");if(hb)hb.onclick=function(e){e.stopPropagation();clearTimeout(S.hid);showHelper(hintFind,true)};
  document.querySelectorAll("[data-a]").forEach(function(btn){btn.onclick=function(){
    var i=+btn.getAttribute("data-a"),o=byId(S.pend),c=o.a[i];
    if(c.ok){S.res[o.id]=1;S.pend=null;S.atried=[];S.afb="";S.warn=false;S.good=true;S.msg="<b>"+o.name+": верно</b>"+c.fb;var sc=document.getElementById("sc");if(sc){sc.setAttribute("tabindex","-1");setTimeout(function(){sc.focus({preventScroll:true})},0)}}
    else{S.atried=(S.atried||[]).concat([i]);S.err[2]++;save();S.afb=c.fb;S.warn=true;S.good=false}
    drawFind();arm(resolved()<HOT.length?hintFind:"");}});

function onScene(e){
  var r=$("#sc").getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH,hit=null,dc=null;
  if(S.pend){return}
  HOT.forEach(function(o){if(!hit&&hitZ(o,x,y))hit=o});
  if(hit){
    if(S.res[hit.id]){S.msg="<b>"+hit.name+"</b>Это место уже разобрано. Осмотр продолжается.";S.warn=false;S.good=false}
    else{if(S.found.indexOf(hit.id)<0)S.found.push(hit.id);S.pend=hit.id;S.afb="";S.atried=[];S.good=false;S.warn=false;S.msg="";window.scrollTo(0,0)}
  }else{S.miss++;save();DEC.forEach(function(o){if(!dc&&hitZ(o,x,y))dc=o});
    S.msg=dc?"<b>"+dc.name+"</b>Здесь всё в порядке. Осмотр продолжается.":"Здесь нарушений нет. Осмотр продолжается.";S.warn=false;S.good=false}
  $("#scw").innerHTML=scene(1,S.found);$("#sc").addEventListener("click",onScene);drawFind();arm(resolved()<HOT.length?hintFind:"");
}

function rEnd(){
  var e=S.err,t=e[0]+e[1]+e[2],parts=[["сбор на смену",e[0]],["решения при осмотре",e[2]],["решение у мясорубки",e[1]]];
  var worst=parts.slice().sort(function(x,y){return y[1]-x[1]})[0];
  var clean=t===0&&!S.skipped,ttl=clean?"Все решения верны":"Смена готова";
  var txt=clean?"Повар собран, кухня осмотрена, решение выбрано без ошибок.":(t===0?"Часть шагов пропущена. Пройдите упражнения полностью, чтобы проверить себя.":"Все ошибки разобраны и исправлены. Больше всего ошибок в части «"+worst[0]+"». Загляните в памятку."+(S.skipped?" Часть шагов пропущена.":""));
  app.innerHTML=top("Итог")+'<div class="wrap fade center"><div class="card"><div style="display:flex;justify-content:center">'+person(null,"after",190)+'</div><h1>'+ttl+'</h1><p>'+txt+'</p></div><button class="btn" id="m">Открыть памятку</button><button class="btn ghost" id="r">Пройти ещё раз</button>'+
    '<details class="rep"><summary>Что увидит руководитель в курсе</summary><span class="stat"><span>Ошибки при сборе на смену</span><b>'+e[0]+'</b></span><span class="stat"><span>Ошибки в решениях при осмотре</span><b>'+e[2]+'</b></span><span class="stat"><span>Ошибки в решении у мясорубки</span><b>'+e[1]+'</b></span><span class="stat"><span>Нажатия мимо при осмотре</span><b>'+S.miss+'</b></span><span class="stat"><span>Открытые подсказки</span><b>'+S.hints+'</b></span></details></div>';
  $("#m").onclick=function(){go("memo")};$("#r").onclick=function(){S.err=[0,0,0];S.done=false;S.skipped=false;startPart(1)};
}

  var on=["hat","jacket","mitts"].map(function(id){return ico(id)}).join(''),off=["ring","earrings","watch","badge","coat"].map(function(id){return ico(id)}).join('');
  var h=top("Памятка")+'<div class="wrap fade"><h2 style="margin:4px 0 10px">Коротко: что делать</h2>';
  h+='<div class="mc"><div class="mh"><span class="mn">1</span>Перед сменой и в работе</div>'+
     '<div class="mrow"><span class="ml ok">На смену</span><div class="mi">'+on+'</div></div>'+
     '<div class="mrow"><span class="ml no">В шкафчик</span><div class="mi">'+off+'</div></div>'+
     '<div class="mrow"><span class="ml ok">Руки</span><div class="mt">Ногти коротко, без лака. Вымыть руки с мылом</div></div>'+
     '<div class="mrow"><span class="ml ok">Горячее</span><div class="mt">Брать рукавицами или прихватками</div></div></div>';
  h+='<div class="mc"><div class="mh"><span class="mn">2</span>Осмотр рабочего места</div>'+
     '<div class="cols"><div class="col"><b>Убрать сразу</b><span>Лужа на полу</span><span>Коробки в проходе</span></div>'+
     '<div class="col tell"><b>Сообщить руководителю</b><span>Повреждённый шнур</span><span>Шаткая полка</span><span>Посуда со сколом</span></div></div>'+
     '<div class="mt" style="margin-top:8px">До устранения неисправности к работе не приступать</div></div>';
  h+='<div class="mc warnc"><div class="mh"><span class="mn">3</span>Прибор сломался, шумит или пахнет проводкой</div>'+
     '<div class="steps"><span><i>1</i>Выключить</span><span><i>2</i>Сообщить руководителю</span><span><i>3</i>Не включать до ремонта</span></div>'+
     '<div class="mt" style="margin-top:8px">Включённое оборудование без присмотра не оставлять</div></div>';
  app.innerHTML=h+(S.done?'<div class="panel good"><b>Блок завершён</b>В курсе после этого руководитель увидит отметку о прохождении.</div>':'<div class="panel"><b>Это памятка</b>Пройдите упражнения, чтобы получить отметку о прохождении.</div>')+'<button class="btn" id="l">В начало</button></div>';
  $("#l").onclick=function(){go("start")};
}
document.getElementById("hbtn").addEventListener("click",function(e){e.stopPropagation();var h=document.getElementById("helper");if(h.classList.contains("open"))h.classList.remove("open");else openHelper()});
document.addEventListener("click",function(e){if(!e.target.closest||!e.target.closest("#hbtn"))hideHelper()},true);
render();
})();
